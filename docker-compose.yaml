services:
  postgres:
    image: postgres:16
    container_name: contorno-lonas-db
    environment:
      POSTGRES_DB: contorno-lonas
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: